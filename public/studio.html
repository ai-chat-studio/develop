<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Studio — MVP v0.4</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">MVP v0.4</div>
        <h1>AI Studio</h1>
      </div>

      <div class="status-stack">
        <div id="serverStatus" class="status status-offline">● server offline</div>
        <div id="bridgeStatus" class="status status-offline">● bridge unknown</div>
      </div>
    </header>

    <section class="card">
      <div class="section-title">Русский диалог</div>
      <div id="ruChat" class="chat"></div>
    </section>

    <section class="card">
      <div class="section-title">Ты → AI</div>

      <textarea
        id="prompt"
        rows="5"
        maxlength="10000"
        placeholder="Напиши сообщение по-русски..."
      ></textarea>

      <div class="actions">
        <button id="sendAI" class="primary">Send to AI</button>
        <button id="checkBridge" class="secondary">Проверить Bridge</button>
        <button id="clear" class="secondary">Очистить диалог</button>
        <a class="button-link secondary" href="/live.html" target="_blank">Открыть LIVE</a>
      </div>

      <p id="aiState" class="hint">Готово к отправке.</p>
    </section>

    <section class="card debug-card">
      <details>
        <summary>Последний сырой ответ AI</summary>
        <pre id="rawAnswer">Пока ответов нет.</pre>
      </details>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/studio.js"></script>
</body>
</html>
